[package]
name = "kawi-plugin-sdk"
version = "0.8.0"
description = "Rust SDK for Kawi WebAssembly plugins"
readme = "README.md"
documentation = "https://docs.rs/kawi-plugin-sdk"
edition.workspace = true
authors.workspace = true
license.workspace = true
categories = ["development-tools", "wasm"]
keywords = ["kawi", "plugin", "wasm", "component"]
repository.workspace = true
rust-version.workspace = true
include = ["src/**", "wit/**", "README.md", "CHANGELOG.md"]

[dependencies]
wit-bindgen = "=0.63.0"

[lib]
crate-type = ["rlib"]
