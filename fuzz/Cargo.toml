[package]
name = "kawi-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
kawi-buffer = { path = "../crates/kawi-buffer" }
kawi-jsonrpc = { path = "../crates/kawi-jsonrpc" }
kawi-plugin = { path = "../crates/kawi-plugin", features = ["fuzz"] }
libfuzzer-sys = "0.4"
ropey = "1.6.1"
serde_json = "1"

[workspace]

[[bin]]
name = "network_policy"
path = "fuzz_targets/network_policy.rs"
test = false
doc = false

[[bin]]
name = "stream_bytes"
path = "fuzz_targets/stream_bytes.rs"
test = false
doc = false

[[bin]]
name = "process_framing"
path = "fuzz_targets/process_framing.rs"
test = false
doc = false

[[bin]]
name = "authorization"
path = "fuzz_targets/authorization.rs"
test = false
doc = false

[[bin]]
name = "host_imports"
path = "fuzz_targets/host_imports.rs"
test = false
doc = false

[[bin]]
name = "process_run"
path = "fuzz_targets/process_run.rs"
test = false
doc = false
