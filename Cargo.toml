[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/kawi"]


[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Hilmi Abroor"]
license = "GPL-3.0-or-later"
categories = ["editor"]
repository = "https://github.com/uint82/kawi"
rust-version = "1.98.0"


[workspace.dependencies]





# external
anyhow = "1"
crossterm = "0.29"
libc = "0.2"
regex = "1"
lsp-types = "=0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
toml = "0.9"
toml_edit = "0.23"
