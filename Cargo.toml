[workspace]
resolver = "2"
members = ["crates/*", "examples/wasm-trim"]
default-members = ["crates/kawi"]
exclude = ["fuzz"]


[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Hilmi Abroor"]
license = "GPL-3.0-or-later"
categories = ["text-editors"]
repository = "https://github.com/uint82/kawi"
rust-version = "1.98.0"


[workspace.dependencies]





kawi-buffer = { version = "0.0.1", path = "crates/kawi-buffer" }
kawi-completion = { version = "0.0.1", path = "crates/kawi-completion" }
kawi-dap = { version = "0.0.1", path = "crates/kawi-dap" }
kawi-editor = { version = "0.0.1", path = "crates/kawi-editor" }
kawi-git = { version = "0.0.1", path = "crates/kawi-git" }
kawi-help = { version = "0.0.1", path = "crates/kawi-help" }
kawi-jsonrpc = { version = "0.0.1", path = "crates/kawi-jsonrpc" }
kawi-lsp = { version = "0.0.1", path = "crates/kawi-lsp" }
kawi-picker = { version = "0.0.1", path = "crates/kawi-picker" }
kawi-plugin = { version = "0.0.1", path = "crates/kawi-plugin" }
kawi-plugin-sdk = { version = "0.7.0", path = "crates/kawi-plugin-sdk" }
kawi-process = { version = "0.0.1", path = "crates/kawi-process" }
kawi-syntax = { version = "0.0.1", path = "crates/kawi-syntax" }
kawi-task = { version = "0.0.1", path = "crates/kawi-task" }
kawi-terminal = { version = "0.0.1", path = "crates/kawi-terminal" }
kawi-tui = { version = "0.0.1", path = "crates/kawi-tui" }
kawi-watch = { version = "0.0.1", path = "crates/kawi-watch" }

# external
anyhow = "1"
bytes = "1"
crossterm = "0.29"
libc = "0.2"
notify = "8"
regex = "1"
lsp-types = "=0.97.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tokio = { version = "1", features = ["time"] }
toml = "1.1"
toml_edit = "0.25"
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.18"
wasmtime = { version = "=50.0.1", default-features = false, features = ["component-model", "cranelift", "reexport-wasmparser", "runtime", "std", "async", "wat"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"] }
