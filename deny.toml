[graph]
all-features = true
exclude = ["kawi-fuzz"]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "bitflags@1.3.2", reason = "lsp-types 0.97 uses fluent-uri with bitflags 1" },
    { crate = "cpufeatures@0.2.17", reason = "wasmtime's sha2 0.10 and rand 0.10 require different generations" },
    { crate = "getrandom@0.2.17", reason = "ureq's rustls stack uses the 0.2 generation" },
    { crate = "hashbrown@0.16.1", reason = "wasmtime's gimli 0.33 and indexmap require different generations" },
    { crate = "syn@2.0.119", reason = "proc-macro dependencies span syn 2 and syn 3" },
    { crate = "thiserror@1.0.69", reason = "portable-pty's filedescriptor 0.8 still requires thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "portable-pty's filedescriptor 0.8 still requires thiserror 1" },
    { crate = "wasm-encoder@0.261.0", reason = "wasmtime 50 uses wasm-tools 0.261 and the guest SDK uses 0.262" },
    { crate = "wasm-metadata@0.261.0", reason = "wasmtime 50 uses wasm-tools 0.261 and the guest SDK uses 0.262" },
    { crate = "wasmparser@0.261.0", reason = "wasmtime 50 uses wasm-tools 0.261 and the guest SDK uses 0.262" },
    { crate = "wit-component@0.261.0", reason = "wasmtime 50 uses wasm-tools 0.261 and the guest SDK uses 0.262" },
    { crate = "wit-parser@0.261.0", reason = "wasmtime 50 uses wasm-tools 0.261 and the guest SDK uses 0.262" },
    { crate = "windows-sys@0.52.0", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows-sys@0.60.2", reason = "transitive Windows dependencies use different windows-sys generations" },
    { crate = "windows-targets@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_i686_gnu@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_i686_msvc@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "ureq's rustls stack uses the 0.52 generation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
