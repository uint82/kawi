name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --workspace --no-default-features
      - name: Package SDK
        run: cargo publish --dry-run -p kawi-plugin-sdk
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.262.0
      - name: Install wasm component linker
        run: cargo install wasm-component-ld --version 0.5.31 --locked
      - name: Rebuild wasm fixtures
        run: crates/kawi-plugin/tests/fixtures/wasm/build.sh
      - name: Format network fixture
        run: cargo fmt --manifest-path crates/kawi-plugin/tests/fixtures/wasm/network/Cargo.toml -- --check
      - name: Rebuild network fixture
        run: crates/kawi-plugin/tests/fixtures/wasm/build-network.sh
      - name: Format config fixture
        run: cargo fmt --manifest-path crates/kawi-plugin/tests/fixtures/wasm/config/Cargo.toml -- --check
      - name: Rebuild config fixture
        run: crates/kawi-plugin/tests/fixtures/wasm/config/build.sh
      - name: Format jobs fixture
        run: cargo fmt --manifest-path crates/kawi-plugin/tests/fixtures/wasm/jobs/Cargo.toml -- --check
      - name: Rebuild jobs fixture
        run: sh crates/kawi-plugin/tests/fixtures/wasm/jobs/build.sh
      - name: Format panels fixture
        run: cargo fmt --manifest-path crates/kawi-plugin/tests/fixtures/wasm/panels/Cargo.toml -- --check
      - name: Rebuild panels fixture
        run: sh crates/kawi-plugin/tests/fixtures/wasm/panels/build.sh
      - name: Check wasm fixtures are current
        run: git diff --exit-code -- crates/kawi-plugin/tests/fixtures/wasm
      - name: Build WASM trim example
        run: sh examples/wasm-trim/build.sh
      - name: Check WASM trim example is current
        run: git diff --exit-code -- examples/wasm-trim
      - name: Conformance
        run: cargo test -p kawi-plugin --test conformance -- --nocapture
      - name: Conformance WASM feature
        run: cargo test -p kawi-plugin --features wasm --test conformance -- --nocapture
      - name: Conformance WASM test network override
        run: cargo test -p kawi-plugin --features wasm,wasm-test-network --test conformance -- --nocapture
      - name: Check default dependencies
        run: |
          cargo tree -p kawi -e normal | grep -q "wasmtime v"
          if cargo tree -p kawi --no-default-features -e normal | grep -q wasmtime; then
            echo "the no-default-features build must not include wasmtime" >&2
            exit 1
          fi
      - name: Check WASM dependencies
        run: cargo tree -p kawi --no-default-features --features wasm -e normal | grep -q "wasmtime v"
      - name: Check release excludes test network override
        run: |
          cargo build -p kawi --release
          cargo build -p kawi --release --no-default-features
          if cargo tree -p kawi -e features -i kawi-plugin | grep -q 'kawi-plugin feature "wasm-test-network"'; then
            echo "wasm-test-network must not be enabled in the default build" >&2
            exit 1
          fi
          if cargo tree -p kawi --features wasm -e features -i kawi-plugin | grep -q 'kawi-plugin feature "wasm-test-network"'; then
            echo "wasm-test-network must not be enabled in the wasm build" >&2
            exit 1
          fi
      - name: Lint WASM trim example
        run: cargo clippy -p wasm-trim --target wasm32-wasip2 -- -D warnings
      - name: Lint jobs fixture
        run: cargo clippy --manifest-path crates/kawi-plugin/tests/fixtures/wasm/jobs/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - name: Lint panels fixture
        run: cargo clippy --manifest-path crates/kawi-plugin/tests/fixtures/wasm/panels/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - name: Lint WASM feature
        run: cargo clippy -p kawi --all-targets --features wasm -- -D warnings
      - name: Lint WASM test network feature
        run: cargo clippy -p kawi-plugin --all-targets --features wasm,wasm-test-network -- -D warnings
      - name: Check WASM feature
        run: cargo check -p kawi --features wasm
      - name: Check no-WASM feature
        run: cargo check -p kawi --no-default-features
      - name: Test WASM feature
        run: cargo test -p kawi-plugin --features wasm
      - name: Test WASM app feature
        run: cargo test -p kawi --features wasm --bin kawi app::plugin::tests::wasm
      - name: Test plugin scaffold
        run: cargo test -p kawi --bin kawi plugin_cli::tests::scaffold_builds_and_runs -- --ignored
  macos:
    name: macos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --workspace --no-default-features --no-fail-fast
      - name: Test PTY startup
        run: cargo test -p kawi --test pty_smoke --no-default-features -- --nocapture
      - name: Check WASM feature
        run: cargo check -p kawi --features wasm
  supply-chain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - "--features kawi/wasm"
          - "--features kawi-plugin/wasm-test-network"
          - "--features kawi/wasm,kawi-plugin/wasm-test-network"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Deny
        run: cargo deny ${{ matrix.args }} check
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - name: Vet
        run: cargo vet
