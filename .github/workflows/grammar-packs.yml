name: grammar-packs

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/kawi-grammar/**"
      - "crates/kawi-syntax/**"
      - "crates/kawi/**"
      - "scripts/build-grammar-pack.sh"
      - "scripts/sync-markdown-queries.sh"
      - "scripts/sync-typescript-queries.sh"
      - ".github/workflows/grammar-packs.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/kawi-grammar/**"
      - "crates/kawi-syntax/**"
      - "crates/kawi/**"
      - "scripts/build-grammar-pack.sh"
      - "scripts/sync-markdown-queries.sh"
      - "scripts/sync-typescript-queries.sh"
      - ".github/workflows/grammar-packs.yml"

permissions:
  contents: read

concurrency:
  group: grammar-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: adl
            version: 0.7.0
            repository: alexytsu/tree-sitter-adl
            revision: 5ffcda9174faa0b24331513c00f35cac823c1960
            source: .
          - id: typescript
            version: 0.23.2
            repository: tree-sitter/tree-sitter-typescript
            revision: f975a621f4e7f532fe322e13c4f79495e0a7b2e7
            source: typescript
          - id: markdown
            version: 0.5.4
            repository: tree-sitter-grammars/tree-sitter-markdown
            revision: 41ff24a6c775492c543b09228aeb98d1cd2b3a0f
            source: tree-sitter-markdown
          - id: markdown_inline
            version: 0.5.4
            repository: tree-sitter-grammars/tree-sitter-markdown
            revision: 41ff24a6c775492c543b09228aeb98d1cd2b3a0f
            source: tree-sitter-markdown-inline
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.262.0
      - name: Install tree-sitter
        run: cargo install tree-sitter-cli --version 0.26.9 --locked
      - name: Check out the ${{ matrix.id }} grammar
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: grammar
      - name: Rebuild the ${{ matrix.id }} pack
        run: |
          pack="/tmp/${{ matrix.id }}-pack"
          cp -R "crates/kawi-grammar/packs/${{ matrix.id }}/${{ matrix.version }}" "$pack"
          sh scripts/build-grammar-pack.sh "grammar/${{ matrix.source }}" "$pack"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint grammar crates
        run: cargo clippy -p kawi-grammar -p kawi-syntax --all-targets -- -D warnings
      - name: Lint editor
        run: cargo clippy -p kawi --all-targets --features wasm-grammars -- -D warnings
      - name: Test grammar crates
        run: cargo test -p kawi-grammar -p kawi-syntax
      - name: Test editor with grammar packs
        run: cargo test -p kawi --features wasm-grammars
      - name: Check default dependencies
        run: |
          if cargo tree -p kawi -e normal | grep -q "wasmtime v"; then
            echo "the default build must not include wasmtime" >&2
            exit 1
          fi
      - name: Check grammar dependencies
        run: cargo tree -p kawi --features wasm-grammars -e normal | grep -q "wasmtime v"

  release-layout:
    name: release layout (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the release archive layout
        run: cargo test -p kawi --features wasm-grammars --test release_archive
